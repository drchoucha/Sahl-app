<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>سهل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F1EA;
    --ink: #23241F;
    --ink-soft: #5B5D54;
    --card: #FFFFFF;
    --line: #DEDACB;

    --emergency: #A6291E;
    --emergency-dark: #7E1E15;
    --family: #2F6B4F;
    --family-dark: #234E3A;
    --medicine: #B5720E;
    --medicine-dark: #8A5709;
    --doctor: #1F4E79;
    --doctor-dark: #163A5A;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }

  #app{ display:flex; flex-direction:column; min-height:100vh; padding:20px 18px 28px; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 4px 18px;
  }
  .greeting{ display:flex; flex-direction:column; gap:2px; }
  .greeting .hello{ font-size:26px; font-weight:700; color:var(--ink); }
  .greeting .clock{ font-size:17px; color:var(--ink-soft); font-weight:500; }
  .gear{
    width:44px; height:44px; border-radius:50%;
    background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .gear svg{ width:22px; height:22px; }

  .grid{
    display:flex; flex-direction:column; gap:16px;
    flex:1;
  }

  .btn{
    border:none; border-radius:22px; cursor:pointer;
    display:flex; align-items:center; gap:18px;
    padding:26px 24px;
    color:#fff; text-align:right;
    width:100%;
    box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    position:relative;
    overflow:hidden;
  }
  .btn:active{ transform: translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.18); }

  .btn .icon{
    width:58px; height:58px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.22);
    border-radius:16px;
  }
  .btn .icon svg{ width:32px; height:32px; }

  .btn .label{ font-size:26px; font-weight:700; line-height:1.25; }
  .btn .sub{ font-size:15px; font-weight:500; opacity:0.85; margin-top:2px; }

  .btn.emergency{ background:var(--emergency); min-height:118px; }
  .btn.family{ background:var(--family); }
  .btn.medicine{ background:var(--medicine); }
  .btn.doctor{ background:var(--doctor); }

  .btn.emergency .progress{
    position:absolute; inset:0; background:var(--emergency-dark);
    transform: scaleX(0); transform-origin: right;
    transition: transform linear;
  }
  .btn.emergency .content{ position:relative; z-index:1; display:flex; align-items:center; gap:18px; width:100%; }

  .hint{
    text-align:center; color:var(--ink-soft); font-size:15px;
    margin-top:14px; font-weight:500;
  }

  /* Confirmation overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,18,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background:var(--card); width:100%; max-width:520px;
    border-radius:26px 26px 0 0; padding:30px 24px 34px;
    text-align:center;
  }
  .sheet .icon-big{
    width:78px; height:78px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet .icon-big.ok{ background:#E4F0E9; }
  .sheet .icon-big svg{ width:40px; height:40px; }
  .sheet h2{ font-size:24px; margin:0 0 8px; }
  .sheet p{ font-size:17px; color:var(--ink-soft); margin:0 0 24px; line-height:1.6; }
  .sheet button{
    width:100%; padding:18px; border-radius:16px; border:none;
    font-family:'Tajawal',sans-serif; font-size:19px; font-weight:700;
    background:var(--ink); color:#fff; cursor:pointer;
  }

  @media (min-width: 560px){
    #app{ max-width:520px; margin:0 auto; }
  }

  /* ---- Settings screen ---- */
  #settingsScreen{
    display:none;
    min-height:100vh; background:var(--bg);
    padding:20px 18px 40px;
  }
  #settingsScreen.show{ display:block; }
  @media (min-width: 560px){ #settingsScreen{ max-width:520px; margin:0 auto; } }

  .settings-header{
    display:flex; align-items:center; gap:12px; padding:6px 4px 20px;
  }
  .back-btn{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .back-btn svg{ width:20px; height:20px; }
  .settings-header h1{ font-size:22px; margin:0; }

  .settings-note{
    background:#EFE8D6; border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; font-size:14.5px; color:var(--ink-soft); margin-bottom:22px;
    line-height:1.6;
  }

  .field-group{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 16px; margin-bottom:16px;
  }
  .field-group h3{ font-size:16px; margin:0 0 14px; color:var(--ink); }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ display:block; font-size:13.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .field input{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:#FCFBF8; font-family:'Tajawal',sans-serif; font-size:16px; color:var(--ink);
  }
  .field input:focus{ outline:2px solid var(--doctor); outline-offset:1px; }

  .save-bar{
    position:sticky; bottom:0; padding-top:10px;
  }
  .save-btn{
    width:100%; padding:16px; border-radius:14px; border:none;
    background:var(--ink); color:#fff; font-family:'Tajawal',sans-serif;
    font-size:17px; font-weight:700; cursor:pointer;
  }
  .saved-flash{
    text-align:center; font-size:14px; color:var(--family); font-weight:600;
    margin-top:10px; opacity:0; transition:opacity 200ms;
  }
  .saved-flash.show{ opacity:1; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="greeting">
      <div class="hello" id="hello">مرحبًا</div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <button class="gear" id="settingsBtn" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5B5D54" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="grid">
    <button class="btn emergency" id="emergencyBtn">
      <div class="progress" id="emergencyProgress"></div>
      <div class="content">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 9v4"/><circle cx="12" cy="16.5" r="0.6" fill="#fff"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
        <div>
          <div class="label">طوارئ</div>
          <div class="sub">اضغط مطولًا لإرسال التنبيه</div>
        </div>
      </div>
    </button>

    <button class="btn family" id="familyBtn">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg></div>
      <div>
        <div class="label">اتصل بالعائلة</div>
        <div class="sub" id="familySub">لم يتم تسجيل رقم بعد</div>
      </div>
    </button>

    <button class="btn medicine" id="medicineBtn">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M12 12v4M10 14h4"/></svg></div>
      <div>
        <div class="label">دواء اليوم</div>
        <div class="sub" id="medSub">لا توجد تذكيرات بعد</div>
      </div>
    </button>

    <button class="btn doctor" id="doctorBtn">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M8 3v4M16 3v4"/><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M9 13a3 3 0 0 0 6 0v-2H9Z"/></svg></div>
      <div>
        <div class="label">اتصل بالطبيب</div>
        <div class="sub" id="doctorSub">لم يتم تسجيل رقم بعد</div>
      </div>
    </button>
  </div>

  <div class="hint">اضغط على أي زر للاستخدام</div>
</div>

<!-- Settings screen (filled in by a family member) -->
<div id="settingsScreen">
  <div class="settings-header">
    <button class="back-btn" id="backBtn" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="#23241F" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <h1>الإعدادات</h1>
  </div>

  <div class="settings-note">هذه الشاشة مخصّصة للابن أو الابنة — لإعداد أرقام الاتصال ومواعيد الدواء لمرة واحدة.</div>

  <div class="field-group">
    <h3>جهة اتصال العائلة</h3>
    <div class="field">
      <label for="familyName">الاسم (يظهر على الزر)</label>
      <input type="text" id="familyName" placeholder="مثال: ابني أحمد">
    </div>
    <div class="field">
      <label for="familyPhone">رقم الهاتف</label>
      <input type="tel" id="familyPhone" placeholder="0555 12 34 56">
    </div>
  </div>

  <div class="field-group">
    <h3>جهة اتصال الطبيب</h3>
    <div class="field">
      <label for="doctorName">الاسم (يظهر على الزر)</label>
      <input type="text" id="doctorName" placeholder="مثال: د. شوشة">
    </div>
    <div class="field">
      <label for="doctorPhone">رقم الهاتف</label>
      <input type="tel" id="doctorPhone" placeholder="0555 98 76 54">
    </div>
  </div>

  <div class="field-group">
    <h3>تذكير الدواء</h3>
    <div class="field">
      <label for="medTime">وقت الجرعة</label>
      <input type="time" id="medTime">
    </div>
    <div class="field" id="notifPermField">
      <label>إشعارات التذكير</label>
      <button type="button" id="enableNotifBtn" class="save-btn" style="background:var(--doctor); font-size:15px; padding:12px;">تفعيل إشعار وقت الدواء</button>
      <div id="notifStatus" style="font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.6;"></div>
    </div>
  </div>

  <div class="save-bar">
    <button class="save-btn" id="saveSettingsBtn">حفظ</button>
    <div class="saved-flash" id="savedFlash">تم الحفظ ✓</div>
  </div>
</div>

<!-- Confirmation sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="icon-big ok"><svg viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2 id="sheetTitle">تم الإرسال</h2>
    <p id="sheetText">تم إرسال موقعك وطلب المساعدة.</p>
    <button id="sheetClose">حسنًا</button>
  </div>
</div>

<script>
  // ---- Clock & greeting ----
  function updateClock(){
    const now = new Date();
    const h = now.getHours();
    const hh = String(h).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = hh + ':' + mm;
    let greeting = 'مرحبًا';
    if (h < 12) greeting = 'صباح الخير';
    else if (h < 18) greeting = 'مساء الخير';
    else greeting = 'مساء الخير';
    document.getElementById('hello').textContent = greeting;
  }
  updateClock();
  setInterval(updateClock, 15000);

  // ---- Settings (stored locally on this device) ----
  function loadSettings(){
    try{
      return JSON.parse(localStorage.getItem('sahl_settings') || '{}');
    }catch(e){ return {}; }
  }
  function saveSettings(s){
    localStorage.setItem('sahl_settings', JSON.stringify(s));
  }
  let settings = loadSettings();

  function refreshLabels(){
    document.getElementById('familySub').textContent = settings.familyName
      ? ('اتصال بـ ' + settings.familyName) : 'لم يتم تسجيل رقم بعد';
    document.getElementById('doctorSub').textContent = settings.doctorName
      ? ('اتصال بـ ' + settings.doctorName) : 'لم يتم تسجيل رقم بعد';
    document.getElementById('medSub').textContent = settings.medTime
      ? ('التذكير القادم: ' + settings.medTime) : 'لا توجد تذكيرات بعد';
  }
  refreshLabels();

  function showSheet(title, text){
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetText').textContent = text;
    document.getElementById('overlay').classList.add('show');
  }
  document.getElementById('sheetClose').addEventListener('click', ()=>{
    document.getElementById('overlay').classList.remove('show');
  });

  // ---- Family call ----
  document.getElementById('familyBtn').addEventListener('click', ()=>{
    if (settings.familyPhone){
      window.location.href = 'tel:' + settings.familyPhone;
    } else {
      showSheet('لم يتم الإعداد بعد', 'اطلب من ابنك أو ابنتك إضافة رقم الهاتف من شاشة الإعدادات.');
    }
  });

  // ---- Doctor call ----
  document.getElementById('doctorBtn').addEventListener('click', ()=>{
    if (settings.doctorPhone){
      window.location.href = 'tel:' + settings.doctorPhone;
    } else {
      showSheet('لم يتم الإعداد بعد', 'اطلب من ابنك أو ابنتك إضافة رقم الطبيب من شاشة الإعدادات.');
    }
  });

  // ---- Medicine reminder (basic, in-app confirmation for MVP) ----
  document.getElementById('medicineBtn').addEventListener('click', ()=>{
    showSheet('تذكير الدواء', settings.medTime
      ? ('موعد الدواء القادم: ' + settings.medTime + '. اضغط على "حسنًا" بعد أخذه.')
      : 'لا توجد تذكيرات مسجّلة بعد. اطلب من ابنك أو ابنتك إضافتها من الإعدادات.');
  });

  // ---- Notifications & medication reminder ----
  // ملاحظة مهمة: هذا الإشعار يعتمد على أن المتصفح/التطبيق يبقى يعمل في الخلفية.
  // على أغلب أجهزة أندرويد هذا يعمل بشكل معقول إذا أُضيف التطبيق للشاشة الرئيسية،
  // لكن التذكير المضمون 100% (حتى لو أُغلق التطبيق تمامًا) يحتاج تغليف Android حقيقي (TWA) لاحقًا.

  let swRegistration = null;
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then((reg)=>{ swRegistration = reg; }).catch(()=>{});
  }

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  function updateNotifStatus(){
    const el = document.getElementById('notifStatus');
    if (!('Notification' in window)){
      el.textContent = 'المتصفح لا يدعم الإشعارات على هذا الجهاز.';
    } else if (Notification.permission === 'granted'){
      el.textContent = 'الإشعارات مفعّلة ✓';
    } else if (Notification.permission === 'denied'){
      el.textContent = 'تم رفض الإذن — يجب تفعيله من إعدادات المتصفح يدويًا.';
    } else {
      el.textContent = 'لم يتم التفعيل بعد.';
    }
  }
  updateNotifStatus();

  document.getElementById('enableNotifBtn').addEventListener('click', ()=>{
    if (!('Notification' in window)) return;
    Notification.requestPermission().then(updateNotifStatus);
  });

  // يتحقق كل 30 ثانية إن كان الوقت الحالي يطابق وقت الجرعة ولم يُرسل تذكير اليوم بعد
  setInterval(()=>{
    if (!settings.medTime) return;
    if (Notification.permission !== 'granted') return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const current = hh + ':' + mm;
    if (current === settings.medTime && settings.medNotifiedOn !== todayKey()){
      settings.medNotifiedOn = todayKey();
      saveSettings(settings);
      const show = (reg) => {
        (reg ? reg.showNotification.bind(reg) : (t,o)=>new Notification(t,o))(
          'حان وقت الدواء 💊',
          { body: 'اضغط لفتح تطبيق سهل وتأكيد أخذ الدواء.', vibrate:[200,100,200], tag:'sahl-med' }
        );
      };
      if (swRegistration) show(swRegistration); else show(null);
    }
  }, 30000);

  // ---- Settings screen ----
  const appScreen = document.getElementById('app');
  const settingsScreen = document.getElementById('settingsScreen');

  function openSettings(){
    document.getElementById('familyName').value = settings.familyName || '';
    document.getElementById('familyPhone').value = settings.familyPhone || '';
    document.getElementById('doctorName').value = settings.doctorName || '';
    document.getElementById('doctorPhone').value = settings.doctorPhone || '';
    document.getElementById('medTime').value = settings.medTime || '';
    updateNotifStatus();
    appScreen.style.display = 'none';
    settingsScreen.classList.add('show');
  }
  function closeSettings(){
    settingsScreen.classList.remove('show');
    appScreen.style.display = 'flex';
    refreshLabels();
  }

  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('backBtn').addEventListener('click', closeSettings);

  document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
    settings.familyName = document.getElementById('familyName').value.trim();
    settings.familyPhone = document.getElementById('familyPhone').value.trim();
    settings.doctorName = document.getElementById('doctorName').value.trim();
    settings.doctorPhone = document.getElementById('doctorPhone').value.trim();
    settings.medTime = document.getElementById('medTime').value;
    saveSettings(settings);
    const flash = document.getElementById('savedFlash');
    flash.classList.add('show');
    setTimeout(()=> flash.classList.remove('show'), 1800);
  });

  // ---- Emergency: press-and-hold 1.6s to avoid accidental triggers ----
  const emBtn = document.getElementById('emergencyBtn');
  const emProgress = document.getElementById('emergencyProgress');
  const HOLD_MS = 1600;
  let holdTimer = null;
  let holdStart = null;

  function startHold(e){
    e.preventDefault();
    holdStart = Date.now();
    emProgress.style.transition = 'transform ' + HOLD_MS + 'ms linear';
    emProgress.style.transform = 'scaleX(1)';
    holdTimer = setTimeout(triggerEmergency, HOLD_MS);
    if (navigator.vibrate) navigator.vibrate(15);
  }
  function cancelHold(){
    clearTimeout(holdTimer);
    emProgress.style.transition = 'transform 200ms ease-out';
    emProgress.style.transform = 'scaleX(0)';
  }
  function triggerEmergency(){
    emProgress.style.transition = 'none';
    emProgress.style.transform = 'scaleX(0)';
    if (navigator.vibrate) navigator.vibrate([80,40,80]);

    const sendMessage = (locText) => {
      if (settings.familyPhone){
        const body = encodeURIComponent('تنبيه طوارئ من تطبيق سهل: أحتاج مساعدة. ' + locText);
        window.location.href = 'sms:' + settings.familyPhone + '?body=' + body;
        showSheet('تم فتح رسالة الطوارئ', 'أرسل الرسالة لإعلام العائلة فورًا.');
      } else {
        showSheet('لم يتم الإعداد بعد', 'لا يوجد رقم طوارئ مسجّل. اطلب من العائلة إضافته من الإعدادات.');
      }
    };

    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          const loc = 'الموقع: https://maps.google.com/?q=' + pos.coords.latitude + ',' + pos.coords.longitude;
          sendMessage(loc);
        },
        ()=> sendMessage('(تعذّر تحديد الموقع)'),
        { timeout: 4000 }
      );
    } else {
      sendMessage('');
    }
  }

  emBtn.addEventListener('touchstart', startHold, {passive:false});
  emBtn.addEventListener('touchend', cancelHold);
  emBtn.addEventListener('touchcancel', cancelHold);
  emBtn.addEventListener('mousedown', startHold);
  emBtn.addEventListener('mouseup', cancelHold);
  emBtn.addEventListener('mouseleave', cancelHold);
</script>
